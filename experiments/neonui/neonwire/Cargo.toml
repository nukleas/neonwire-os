[package]
name = "neonwire"
version = "0.1.0"
edition = "2021"
# The shell's own source is original, but the shipped binary links neon-songs
# (AGPL), so the assembled program is AGPL as a whole. See ../LICENSING.md.
license = "AGPL-3.0-or-later"

[dependencies]
neon-gfx = { path = "../neon-gfx" }
neon-songs = { path = "../neon-songs" }
libc = { workspace = true }
# strudel pattern engine (validated on-device in M0; sounds via our drum voices)
strudel-core = { workspace = true }
strudel-mini = { workspace = true }
# OCINT public API client (https://ocint.app/api/{stats,items})
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
