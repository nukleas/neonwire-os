[workspace]
resolver = "2"
members = ["neon-gfx", "neonwire", "neon-songs"]

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls-backed HTTP for ocint.app (device busybox wget lacks modern TLS)
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

# Path deps into the strudel-rs workspace (Music app pattern engine).
strudel-core = { path = "$HOME/src/strudel-rs/crates/strudel-core" }
strudel-dsp = { path = "$HOME/src/strudel-rs/crates/strudel-dsp" }
strudel-mini = { path = "$HOME/src/strudel-rs/crates/strudel-mini" }

# Size-focused release profile: the binary rides the SD card but small = fast OTA.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
