[workspace]
resolver = "2"
members = ["neon-gfx", "neonwire"]

[workspace.dependencies]
libc = "0.2"

# Path deps into the strudel-rs workspace (Music app, feature-gated in neonwire).
strudel-core = { path = "$HOME/src/strudel-rs/crates/strudel-core" }
strudel-dsp = { path = "$HOME/src/strudel-rs/crates/strudel-dsp" }

# Size-focused release profile: the binary rides the SD card but small = fast OTA.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
